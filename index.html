    <div class="hero-section">
        <div class="hero-content">
            <h1>Sərhədsiz Səyahət AeroJet İlə Başlayır</h1>
            <p>Ən son veb texnologiyaları ilə sürətli, təhlükəsiz və filtrli axtarış sistemini sınayın.</p>
            
            <div class="search-glass-box">
                <form id="search-form" class="search-form">
                    <div class="input-group">
                        <label>Haradan</label>
                        <input type="text" id="origin" placeholder="Məsələn: Bakı" autocomplete="off" required>
                        <ul id="origin-suggestions" class="suggestions-list hidden"></ul>
                    </div>
                    <div class="input-group">
                        <label>Haraya</label>
                        <input type="text" id="destination" placeholder="Məsələn: İstanbul" autocomplete="off" required>
                        <ul id="destination-suggestions" class="suggestions-list hidden"></ul>
                    </div>
                    <div class="input-group">
                        <label>Uçuş Klası</label>
                        <select id="flight-class">
                            <option value="economy">Ekonom Klas</option>
                            <option value="business">Biznes Klas (2x ₼)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Gediş Tarixi</label>
                        <input type="date" required>
                    </div>
                    <button type="submit" class="search-btn">Uçuşları Tap</button>
                </form>
            </div>
        </div>
    </div>

    <div class="container">
        <div id="loader" class="loader-container hidden"><div class="spinner"></div><p>Sistem axtarış edir...</p></div>
        <div id="results"></div>
    </div>

    <script src="script.js"></script>
</body>
